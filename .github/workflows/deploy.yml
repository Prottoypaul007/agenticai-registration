name: Vercel Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Rewrite commit author
        run: |
          git config user.email "bsse1613@iit.du.ac.bd"
          git config user.name "Prottoy Paul"
          git commit --amend --reset-author --no-edit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@53

      - name: Validate Vercel secrets
        shell: bash
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name. Configure it in Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit "$missing"

      - name: Pull Vercel Environment Information
        shell: bash
        run: |
          if vercel pull --yes --environment=production --token="$VERCEL_TOKEN"; then
            exit 0
          else
            status=$?
            echo "::error::Vercel pull failed. Verify VERCEL_ORG_ID and VERCEL_PROJECT_ID against the existing project's .vercel/project.json, and ensure VERCEL_TOKEN is valid and can access the owning account/team. Project-scoped tokens can fail during project settings lookup; see the Vercel deployment section in README.md."
            exit "$status"
          fi

      - name: Build Project Artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --no-wait
